<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Swipe &amp; Buy · Arkadaşlık daveti</title>
<style>
  :root { --bg:#fffbea; --card:#ffffff; --text:#2b2340; --muted:#6b6380; --sun:#ffc93c; --line:#f3e3a6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d1828; --card:#2a2338; --text:#f6f1ff; --muted:#bfb5d6; --line:#3d3350; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 1.0625rem; line-height: 1.55;
  }
  main { max-width: 460px; margin: 0 auto; padding: 48px 20px; text-align: center; }
  .simge {
    width: 96px; height: 96px; margin: 0 auto 20px; display: grid; place-items: center;
    font-size: 52px; border-radius: 26px; background: var(--sun);
  }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 10px; }
  p { margin: 0 0 14px; color: var(--muted); }
  .kart { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 22px 18px; }
  a.dugme {
    display: block; margin-top: 18px; padding: 14px 16px; border-radius: 999px;
    background: var(--sun); color: #2b2340; text-decoration: none; font-weight: 500;
  }
  small { display: block; margin-top: 22px; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <div class="simge" aria-hidden="true">🛍️</div>
  <div class="kart">
    <h1>Swipe &amp; Buy henüz yayında değil</h1>
    <p>Bir arkadaşın seni Swipe &amp; Buy'a davet etti. Uygulama yayınlandığında arkadaşından yeni bir davet isteyebilirsin.</p>
    <p id="yuklu" hidden>Uygulama telefonunda yüklüyse daveti aşağıdaki düğmeyle açabilirsin.</p>
    <a id="ac" class="dugme" href="#" hidden>Uygulamada aç</a>
  </div>
  <small>Sun Flower Apps</small>
</main>
<script>
  // Davet kodu adresin "#" sonrasındadır; bu sayfa onu hiçbir yere göndermez.
  (function () {
    var kod = location.hash.replace(/^#/, "");
    if (!/^[A-Za-z0-9_-]{43}$/.test(kod)) return;
    var ac = document.getElementById("ac");
    ac.href = "swipebuy://d#" + kod;
    ac.hidden = false;
    document.getElementById("yuklu").hidden = false;
  })();
</script>
</body>
</html>
