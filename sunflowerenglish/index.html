<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<title>Sunflower English</title>
<meta name="description" content="Kaydırmalı oyunlarla her gün biraz İngilizce.">
<meta name="theme-color" content="#F2F6FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1524" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sunflower">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: one-screen phone/iPad app — growing sunflower as the hero, swipe-card games in a full-screen play sheet, floating tab bar */
:root{
  --bg:#F2F6FA; --surface:#FFFFFF; --sunk:#E6EEF6;
  --ink:#2A1E12; --muted:#6B6256; --line:rgba(42,30,18,.10);
  --petal:#F4B400; --petal-deep:#C98300; --petal-soft:#FFF1C7;
  --leaf:#3C8D4A; --seed:#5A3A1A; --sky:#CFE3F5;
  --good:#2E9E5B; --good-soft:#DDF3E5; --bad:#D9483B; --bad-soft:#FBE1DE;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Nunito", "Avenir Next", system-ui, sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1524; --surface:#18223A; --sunk:#202C47;
  --ink:#F4ECDD; --muted:#A8A08F; --line:rgba(244,236,221,.12);
  --petal:#FFC629; --petal-deep:#FFB000; --petal-soft:#3A3220;
  --leaf:#5DBB6D; --seed:#3B2510; --sky:#22314F;
  --good:#47C47A; --good-soft:#173A28; --bad:#FF6B5E; --bad-soft:#40211F;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1524; --surface:#18223A; --sunk:#202C47;
  --ink:#F4ECDD; --muted:#A8A08F; --line:rgba(244,236,221,.12);
  --petal:#FFC629; --petal-deep:#FFB000; --petal-soft:#3A3220;
  --leaf:#5DBB6D; --seed:#3B2510; --sky:#22314F;
  --good:#47C47A; --good-soft:#173A28; --bad:#FF6B5E; --bad-soft:#40211F;
  color-scheme:dark}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--petal);outline-offset:2px}
#app{height:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding-block:12px 6px}
.brand{font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 50% 50%,var(--seed) 0 34%,var(--petal) 36%);display:inline-block}
.ver{font-size:.72rem;color:var(--muted);font-weight:700;background:var(--sunk);padding:3px 8px;border-radius:99px}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:4px 20px;-webkit-overflow-scrolling:touch}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:22px;margin-block:6px 10px;padding:6px;box-shadow:0 6px 24px rgba(20,30,50,.08)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:16px;font-size:.74rem;font-weight:700;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{background:var(--petal-soft);color:var(--ink)}
.tab[aria-current="page"] svg{color:var(--petal-deep)}

h1,h2,h3{font-family:var(--display);letter-spacing:-.015em;margin:0;text-wrap:balance}
h1{font-size:clamp(1.6rem,6vw,2.1rem);font-weight:800;line-height:1.1}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.05rem;font-weight:800}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--muted)}

/* Home */
.home{display:flex;flex-direction:column;gap:16px}
.greet p{margin:6px 0 0;color:var(--muted);font-weight:600}
.garden{position:relative;background:linear-gradient(180deg,var(--sky),var(--surface) 78%);border-radius:28px;padding:10px 12px 14px;display:flex;flex-direction:column;align-items:center;border:1px solid var(--line)}
.garden svg.plant{width:min(62vw,230px);height:auto;display:block}
.stagechip{font-weight:800;font-size:.85rem;background:var(--surface);border:1px solid var(--line);padding:4px 12px;border-radius:99px;margin-top:-4px}
.growbar{width:100%;max-width:300px;margin-top:10px}
.growbar small{display:flex;justify-content:space-between;color:var(--muted);font-weight:700;font-size:.74rem}
.meter{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),var(--petal));border-radius:99px;transition:width .6s}
.cta{width:100%;background:var(--petal);color:#2A1E12;border-radius:22px;padding:16px 18px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 6px 0 var(--petal-deep);transition:transform .1s, box-shadow .1s}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 var(--petal-deep)}
.cta b{font-family:var(--display);font-size:1.25rem;font-weight:800;display:block}
.cta small{font-weight:700;opacity:.75}
.cta .go{width:46px;height:46px;border-radius:50%;background:#2A1E12;color:var(--petal);display:grid;place-items:center;flex:none}
.cta.done{background:var(--good-soft);color:var(--ink);box-shadow:0 6px 0 var(--good)}
.cta.done .go{background:var(--good);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 12px;min-width:0}
.stat b{font-family:var(--display);font-size:1.5rem;font-weight:800;display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted);font-weight:700}
.stat svg{width:20px;height:20px;color:var(--petal-deep)}
.goalcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.goalcard .row{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.rank{display:flex;gap:12px;align-items:center}
.rank .badge{width:44px;height:44px;border-radius:14px;background:var(--petal-soft);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.2rem;color:var(--petal-deep);flex:none}
.rank>div:last-child{flex:1;min-width:0}
.quote{border-left:4px solid var(--petal);padding:4px 0 4px 12px}
.quote q{font-family:var(--display);font-weight:600;font-size:1.1rem;quotes:none;display:block}
.quote .speak{margin-left:6px;vertical-align:middle}

/* Games */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:128px;transition:transform .12s}
.game:active{transform:scale(.97)}
.game .ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--sunk)}
.game .ico svg{width:24px;height:24px}
.game h3{margin-top:4px}
.game p{margin:0;font-size:.82rem;color:var(--muted);font-weight:600}
.game.hero{grid-column:1/-1;background:var(--petal);color:#2A1E12;flex-direction:row;align-items:center;min-height:0;gap:14px;border:0}
.game.hero p{color:#2A1E12;opacity:.75}
.game.hero .ico{background:#2A1E12;color:var(--petal);width:56px;height:56px;flex:none}
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 10px}

/* Units */
.units{display:flex;flex-direction:column;gap:10px}
.unit{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px 14px;text-align:left;width:100%}
.unit .num{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--sunk);flex:none}
.unit .body{flex:1;min-width:0}
.unit .body small{color:var(--muted);font-weight:700}
.unit.active{border:2px solid var(--petal);background:var(--petal-soft)}
.unit.active .num{background:var(--petal);color:#2A1E12}
.unit.locked{opacity:.55}
.unit .tag{font-size:.7rem;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--sunk);white-space:nowrap}
.unit.active .tag{background:var(--petal);color:#2A1E12}
.unit.full .num{background:var(--good);color:#fff}

/* Notebook */
.words{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.wrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow .w{flex:1;min-width:0}
.wrow .w b{display:block;font-weight:800}
.wrow .w span{color:var(--muted);font-size:.88rem}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--sunk)}
.dots i.on{background:var(--leaf)}
.speak{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;background:var(--sunk);color:var(--ink);flex:none}
.speak svg{width:20px;height:20px}
.settings{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.set{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.set p{margin:2px 0 0;font-size:.82rem;color:var(--muted)}
.btn{background:var(--sunk);padding:10px 14px;border-radius:14px;font-weight:800;white-space:nowrap}
.btn.primary{background:var(--petal);color:#2A1E12}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.switch{width:52px;height:30px;border-radius:99px;background:var(--sunk);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{left:25px}
textarea{width:100%;min-height:80px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;font:inherit;font-size:.85rem}
.foot{text-align:center;color:var(--muted);font-size:.78rem;font-weight:700;margin-top:18px}

/* Play sheet */
#play{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;justify-content:center;
  padding:env(safe-area-inset-top,0px) max(16px, env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px, env(safe-area-inset-left,0px))}
#play .wrap{width:100%;max-width:560px;display:flex;flex-direction:column;height:100%}
.ptop{display:flex;align-items:center;gap:12px;padding-block:14px 6px}
.close{width:40px;height:40px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:800;flex:none;font-size:.9rem}
.close.sure{width:auto;padding:0 14px;border-radius:99px;background:var(--bad-soft);color:var(--bad)}
.pbar{flex:1;height:14px;border-radius:99px;background:var(--sunk);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--petal);border-radius:99px;transition:width .35s}
.xpchip{font-weight:800;background:var(--petal-soft);color:var(--petal-deep);padding:6px 10px;border-radius:99px;font-variant-numeric:tabular-nums;white-space:nowrap}
.steplabel{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:8px}
.steplabel h2{font-size:1.2rem}
.combo{font-weight:800;font-size:.85rem;color:var(--petal-deep);white-space:nowrap}
#stage{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
#stage.flash-good{animation:fg .5s}
#stage.flash-bad{animation:fb .5s}
@keyframes fg{0%{background:var(--good-soft)}100%{background:transparent}}
@keyframes fb{0%{background:var(--bad-soft)}100%{background:transparent}}

/* Swipe cards */
.deck{position:relative;flex:1;min-height:300px;margin-block:6px 12px}
.card{position:absolute;inset:0;background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:0 10px 30px rgba(20,30,50,.10);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform;--yes:0;--no:0}
.card.under{transform:scale(.94) translateY(14px);opacity:.7;box-shadow:none}
.card .lbl{position:absolute;top:22px;font-family:var(--display);font-weight:800;font-size:1.1rem;padding:6px 14px;border-radius:12px;border:3px solid;transform:rotate(-8deg)}
.card .lbl.yes{left:22px;color:var(--good);opacity:var(--yes)}
.card .lbl.no{right:22px;color:var(--bad);opacity:var(--no);transform:rotate(8deg)}
.card .big{font-family:var(--display);font-weight:800;font-size:clamp(2rem,9vw,3.1rem);line-height:1.05;letter-spacing:-.02em;word-break:break-word;text-wrap:balance}
.card .big.phr{font-size:clamp(1.5rem,6.5vw,2.2rem)}
.card .eq{width:40px;height:4px;border-radius:4px;background:var(--petal);margin:18px auto}
.card .tr{font-size:clamp(1.3rem,5.5vw,1.8rem);font-weight:800}
.card .hint{position:absolute;bottom:18px;left:0;right:0;font-size:.82rem;color:var(--muted);font-weight:700}
.card .ex{margin-top:16px;font-size:1.05rem;color:var(--muted);font-style:italic;max-width:30ch}
.card .ex mark{background:var(--petal-soft);color:var(--ink);font-style:normal;font-weight:800;padding:0 4px;border-radius:6px}
.card .new{position:absolute;top:18px;left:18px;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--petal-soft);color:var(--petal-deep);padding:4px 10px;border-radius:99px}
.card .speak{margin-top:16px;width:48px;height:48px}
.flipback{display:none}
.card.flipped .flipfront{display:none}
.card.flipped .hint{display:none}
.card.flipped .flipback{display:flex;flex-direction:column;align-items:center}
.decide{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-bottom:14px}
.decide button{padding:16px;border-radius:20px;font-weight:800;font-size:1.05rem;display:flex;align-items:center;justify-content:center;gap:8px}
.decide .l{background:var(--bad-soft);color:var(--bad)}
.decide .r{background:var(--good-soft);color:var(--good)}
.decide.soft .l{background:var(--sunk);color:var(--ink)}

/* Choice questions */
.q{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding-block:10px}
.q .prompt{font-size:.9rem;color:var(--muted);font-weight:700}
.q .sent{font-family:var(--display);font-weight:600;font-size:clamp(1.35rem,5.8vw,1.9rem);line-height:1.25;max-width:24ch}
.blank{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--petal);padding:0 4px;color:var(--petal-deep)}
.blank.ok{color:var(--good);border-color:var(--good)}
.blank.no{color:var(--bad);border-color:var(--bad)}
.q .big{font-family:var(--display);font-weight:800;font-size:clamp(2rem,9vw,3rem);line-height:1.05}
.q .reveal{font-weight:800;font-size:1.2rem;min-height:1.5em}
.bigspeak{width:110px;height:110px;border-radius:50%;background:var(--petal);color:#2A1E12;display:grid;place-items:center;box-shadow:0 6px 0 var(--petal-deep)}
.bigspeak:active{transform:translateY(4px);box-shadow:0 2px 0 var(--petal-deep)}
.bigspeak svg{width:48px;height:48px}
.opts{display:grid;gap:10px;padding-bottom:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:15px 14px;font-weight:800;font-size:1.05rem;text-align:center;transition:transform .08s}
.opt:active{transform:translateY(2px)}
.opt.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);animation:shake .35s}
.opt.fade{opacity:.4}
.after{min-height:58px;padding-bottom:12px}
.after .btn{width:100%;padding:16px;font-size:1.05rem;border-radius:18px}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* Match */
.match{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:center;padding-block:10px}
.tile{background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:14px 8px;font-weight:800;min-height:62px;text-align:center;word-break:break-word;transition:transform .1s, opacity .3s}
.tile.sel{border-color:var(--petal);background:var(--petal-soft)}
.tile.ok{border-color:var(--good);background:var(--good-soft);color:var(--good);opacity:.45;pointer-events:none}
.tile.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}

/* Spell */
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.slot{width:clamp(30px,8.5vw,44px);height:clamp(40px,11vw,54px);border-radius:12px;background:var(--sunk);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.4rem;text-transform:lowercase}
.slot.f{background:var(--surface);border:2px solid var(--petal)}
.slots.ok .slot{border-color:var(--good);color:var(--good)}
.slots.no{animation:shake .35s}
.slots.no .slot{border-color:var(--bad);color:var(--bad)}
.letters{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding-block:10px}
.letter{width:clamp(42px,12vw,54px);height:clamp(48px,13vw,58px);border-radius:14px;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;font-family:var(--display);font-weight:800;font-size:1.4rem}
.letter.used{visibility:hidden}
.hintbtn{font-weight:800;color:var(--muted);text-decoration:underline;padding:6px}

/* Sprint */
.timer{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.timer i{display:block;height:100%;background:var(--leaf);transition:width 1s linear}
.score{font-family:var(--display);font-weight:800;font-size:1.3rem}

/* End */
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;overflow-y:auto;padding-block:10px}
.end svg.plant{width:min(46vw,180px);height:auto}
.end h1{font-size:2rem}
.end .msg{color:var(--muted);font-weight:700;max-width:32ch;margin:0}
.endstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.endstats div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 6px}
.endstats b{font-family:var(--display);font-size:1.5rem;display:block;font-variant-numeric:tabular-nums}
.endstats span{font-size:.74rem;color:var(--muted);font-weight:700}
.levelup{background:var(--petal);color:#2A1E12;font-weight:800;padding:10px 16px;border-radius:16px}
.endbtns{display:flex;flex-direction:column;gap:10px;width:100%;padding-bottom:14px}
.endbtns .btn{padding:16px;font-size:1.05rem;border-radius:18px}

.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:800;max-width:92%;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s;z-index:5}
.toast.show{opacity:1}
.float{position:fixed;font-family:var(--display);font-weight:800;color:var(--petal-deep);pointer-events:none;animation:up 1s forwards;z-index:60}

let REMOTE = null, writing = false, pending = false, pushTimer = null;
function pushRemote() {
  if (!REMOTE) return;

  pushTimer = setTimeout(async () => {
    if (writing) { pending = true; return; }
    writing = true;
    try { await REMOTE.set({ state: JSON.stringify(S), updated: S.updated }); }
    catch (e) { if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) REMOTE = null; }
    writing = false;

  }, 1500);
}
(async () => {
  try {
    if (!window.claude || typeof window.claude.use !== "function") return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc("data/users/" + id + "/progress");
    const snap = await Promise.race([ref.get(), new Promise((_, rej) => setTimeout(() => rej({ code: "timeout" }), 10000))]);
    REMOTE = ref;
    const r = snap.exists ? snap.data() : null;
    if (r && r.state) {
      const rs = JSON.parse(r.state);
      if ((rs.updated || 0) > (S.updated || 0)) {
        S = Object.assign(fresh(), rs);
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
        if ($("#play").hidden) render();
      } else if ((S.updated || 0) > (rs.updated || 0)) pushRemote();
    } else if (S.updated) pushRemote();

})();

let AC = null;
function beep(kind) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const seq = { ok: [660, 880], no: [240, 180], win: [523, 659, 784, 1047], tap: [520] }[kind] || [440];
    let t = AC.currentTime;
    seq.forEach(f => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = kind === "no" ? "triangle" : "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + 0.18); t += 0.11;
    });
  } catch (e) {}
}
const TTS = "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
let voice = null;
function pickVoice() {

/* ---------- Sunflower drawing ---------- */
function flowerHead(cx, cy, r, open, petals) {
  let s = "";
  if (open <= 0) {
    s += `<circle cx="${cx}" cy="${cy}" r="${r * .55}" fill="var(--leaf)"/>`;
    for (let k = 0; k < 6; k++) { const a = k * 60 * Math.PI / 180; s += `<ellipse cx="${cx + Math.cos(a) * r * .45}" cy="${cy + Math.sin(a) * r * .45}" rx="${r * .14}" ry="${r * .3}" transform="rotate(${k * 60 + 90} ${cx + Math.cos(a) * r * .45} ${cy + Math.sin(a) * r * .45})" fill="var(--petal)" opacity=".9"/>`; }
    return s;
  }
  const len = r * (0.45 + 0.55 * open);
  for (let k = 0; k < petals; k++) {
    const ang = (360 / petals) * k, a = ang * Math.PI / 180, d = r * .42 + len * .45;
    const px = cx + Math.cos(a) * d, py = cy + Math.sin(a) * d;
    s += `<ellipse cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" rx="${(r * .16).toFixed(1)}" ry="${(len * .5).toFixed(1)}" transform="rotate(${ang + 90} ${px.toFixed(1)} ${py.toFixed(1)})" fill="${k % 2 ? "var(--petal)" : "var(--petal-deep)"}"/>`;
  }
  s += `<circle cx="${cx}" cy="${cy}" r="${r * .46}" fill="var(--seed)"/>`;
  for (let k = 0; k < 14; k++) { const a = k * 2.4, rr = r * .36 * Math.sqrt((k + .5) / 14); s += `<circle cx="${(cx + Math.cos(a) * rr).toFixed(1)}" cy="${(cy + Math.sin(a) * rr).toFixed(1)}" r="${(r * .045).toFixed(1)}" fill="var(--petal)" opacity=".55"/>`; }
  return s;
}
function plantSVG(stage) {
  const H = [0, 26, 52, 78, 104, 124, 138, 148, 152, 156, 160, 164][stage];
  const ground = 214, top = ground - H;
  let g = `<ellipse cx="100" cy="${ground + 6}" rx="74" ry="12" fill="var(--seed)" opacity=".9"/><ellipse cx="100" cy="${ground + 2}" rx="60" ry="7" fill="var(--seed)"/>`;
  if (stage === 0) {
    g += `<ellipse cx="100" cy="${ground - 4}" rx="8" ry="11" fill="var(--seed)" transform="rotate(-20 100 ${ground - 4})"/><ellipse cx="98" cy="${ground - 7}" rx="2.5" ry="5" fill="var(--petal)" opacity=".5" transform="rotate(-20 98 ${ground - 7})"/>`;
    g += `<path d="M120 ${ground - 30}l3 6 6 3-6 3-3 6-3-6-6-3 6-3z" fill="var(--petal)"/>`;
    return wrapSVG(g, 150);
  }
  let f = `<path d="M100 ${ground} C ${stage > 3 ? 104 : 101} ${ground - H * .4}, ${stage > 3 ? 96 : 99} ${ground - H * .7}, 100 ${top}" stroke="var(--leaf)" stroke-width="${3 + Math.min(stage, 8) * .6}" fill="none" stroke-linecap="round"/>`;
  const leaves = Math.min(1 + Math.floor(stage / 2), 5);
  for (let k = 0; k < leaves; k++) {
    const y = ground - 14 - k * (H * .72 / Math.max(leaves, 1)), side = k % 2 ? -1 : 1, sz = 14 + Math.min(stage, 8) * 1.6 - k;
    f += `<path d="M100 ${y} q ${side * sz * .9} ${-sz * .9} ${side * sz * 1.9} ${-sz * .25} q ${-side * sz * .9} ${sz * .8} ${-side * sz * 1.9} ${sz * .25}z" fill="var(--leaf)"/>`;
  }
  if (stage === 1) f += `<circle cx="100" cy="${top}" r="3" fill="var(--leaf)"/>`;
  if (stage >= 9) {
    f += `<path d="M100 ${ground - H * .45} C 80 ${ground - H * .55}, 64 ${ground - H * .62}, 58 ${ground - H * .74}" stroke="var(--leaf)" stroke-width="4" fill="none" stroke-linecap="round"/>`;
    f += flowerHead(58, ground - H * .74, 22, 1, 14);
  }
  if (stage >= 10) {
    f += `<path d="M100 ${ground - H * .55} C 120 ${ground - H * .62}, 136 ${ground - H * .7}, 142 ${ground - H * .82}" stroke="var(--leaf)" stroke-width="4" fill="none" stroke-linecap="round"/>`;
    f += flowerHead(142, ground - H * .82, 20, 1, 13);
  }
  if (stage >= 5) {
    const open = stage === 5 ? 0 : stage === 6 ? 0.45 : 1;
    const r = stage === 5 ? 18 : 22 + Math.min(stage - 6, 4) * 3;
    f += flowerHead(100, top - r * .3, r, open, 12 + Math.min(stage - 6, 5) * 2);

    });
  }

}

/* ---------- Lesson building ---------- */
function nextNew(n) {
  const out = [];
  const start = UNITS[S.active] && unitUnlocked(UNITS[S.active]) ? S.active : 0;
  const order = UNITS[start].ph ? [UNITS[start], ...UNITS.filter(u => !u.ph)] : [...UNITS.slice(start).filter(u => !u.ph), ...UNITS.filter(u => u.ph)];
  for (const u of order) {
    for (const it of u.items) { if (out.length >= n) break; if (!seen(it)) out.push(it); }
    if (out.length >= n) break;
  }
  if (out.length) S.active = out[0].u;
  return out;
}
function uniqueTr(list) { const s = new Set(), out = []; list.forEach(i => { const k = firstTok(i.tr); if (!s.has(k)) { s.add(k); out.push(i); } }); return out; }
function distract(item, n, key) {
  const bad = new Set([firstTok(item[key])]);
  const pool = shuffle(ITEMS.filter(i => i.u === item.u && i.id !== item.id)).concat(shuffle(ITEMS.filter(i => i.ph === item.ph && i.u !== item.u)));
  const out = [];
  for (const i of pool) { const k = firstTok(i[key]); if (bad.has(k)) continue; bad.add(k); out.push(i[key]); if (out.length >= n) break; }
  return out;
}
function buildLesson() {
  const due = dueList().sort((a, b) => (box(a) - box(b)) || (Math.random() - .5));
  const rev = due.slice(0, 8);
  const fr = nextNew(rev.length >= 6 ? 3 : rev.length >= 3 ? 5 : 6);
  let core = [...fr, ...rev];
  if (core.length < 6) core = core.concat(shuffle(ITEMS.filter(i => seen(i) && !core.includes(i))).slice(0, 6 - core.length));
  if (!core.length) core = shuffle(ITEMS).slice(0, 6);
  const steps = [];
  if (fr.length) steps.push({ type: "intro", items: fr });
  steps.push({ type: "tf", items: shuffle(core).slice(0, 8) });
  const m = uniqueTr(shuffle(core)).slice(0, 5); if (m.length >= 3) steps.push({ type: "match", items: m });
  const f = shuffle(core.filter(i => !i.ph && i.ex)).slice(0, 4); if (f.length) steps.push({ type: "fill", items: f });
  steps.push({ type: TTS ? "listen" : "pick", items: shuffle(core).slice(0, 4) });
  const s = shuffle(core.filter(spellable)).slice(0, 3); if (s.length) steps.push({ type: "spell", items: s });
  return steps;
}
function practicePool(min) {
  let pool = ITEMS.filter(seen);
  if (pool.length < min) {
    const u = UNITS[S.active] || UNITS[0];
    pool = pool.concat(u.items.filter(i => !seen(i)).slice(0, min - pool.length));
    if (pool.length < min) pool = pool.concat(UNITS[0].items.filter(i => !pool.includes(i))).slice(0, Math.max(min, pool.length));
  }
  return shuffle(pool);
}
function startGame(g) {
  const pool = practicePool(10);
  let items;
  if (g === "sprint") return startLesson([{ type: "sprint", items: pool }], true);
  if (g === "flash") items = pool.slice(0, 10);
  else if (g === "match") items = uniqueTr(pool).slice(0, 6);
  else if (g === "fill") items = pool.filter(i => !i.ph && i.ex).slice(0, 8);
  else if (g === "spell") items = pool.filter(spellable).slice(0, 6);
  else items = pool.slice(0, 8);
  if (!items.length) items = shuffle(UNITS[0].items).slice(0, 6);
  startLesson([{ type: g === "flash" ? "flash" : g, items }], true);
}

/* ---------- Swipe mechanics ---------- */
function swipeable(card, onDecide, onTap) {
  let sx = 0, sy = 0, dx = 0, drag = false, gone = false;
  const set = x => { card.style.transform = `translateX(${x}px) rotate(${x / 18}deg)`; const r = Math.max(-1, Math.min(1, x / 110)); card.style.setProperty("--yes", Math.max(0, r)); card.style.setProperty("--no", Math.max(0, -r)); };
  card.addEventListener("pointerdown", e => { if (gone || e.target.closest("button")) return; drag = true; sx = e.clientX; sy = e.clientY; dx = 0; card.style.transition = "none"; try { card.setPointerCapture(e.pointerId); } catch (_) {} });
  card.addEventListener("pointermove", e => { if (!drag) return; dx = e.clientX - sx; set(dx); });
  const up = () => {
    if (!drag) return; drag = false;
    if (Math.abs(dx) > 90) fling(dx > 0 ? "right" : "left");
    else { card.style.transition = "transform .25s"; set(0); if (Math.abs(dx) < 6 && onTap) onTap(); }
  };
  card.addEventListener("pointerup", up); card.addEventListener("pointercancel", up);
  function fling(dir) {
    if (gone) return; gone = true;
    card.style.transition = "transform .3s ease, opacity .3s";
    set(dir === "right" ? 140 : -140);
    requestAnimationFrame(() => { card.style.transform = `translateX(${dir === "right" ? 600 : -600}px) rotate(${dir === "right" ? 24 : -24}deg)`; card.style.opacity = "0"; });
    setTimeout(() => onDecide(dir), 200);
  }
  card.fling = fling;
  return card;
}
document.addEventListener("keydown", e => {
  if (play.hidden) return;
  const top = stage.querySelector(".card:not(.under)");
  if (top && top.fling && (e.key === "ArrowRight" || e.key === "ArrowLeft")) top.fling(e.key === "ArrowRight" ? "right" : "left");
});

MODS.spell = (items, done) => seq(items, (it, next) => {
  const word = it.en.toLowerCase(), letters = shuffle(word.split("").map((c, k) => ({ c, k })));
  let filled = [], finished = false, hinted = 0, wrongs = 0;
  stage.innerHTML = `<div class="q"><div class="prompt">Bunu İngilizce yaz</div><div class="big" style="font-size:clamp(1.6rem,7vw,2.4rem)">${esc(it.tr)}</div><div class="slots" id="slots">${word.split("").map(() => '<div class="slot"></div>').join("")}</div><button class="hintbtn" id="hint">İpucu ver</button></div>
    <div class="letters">${letters.map((l, k) => `<button class="letter" data-k="${k}">${l.c}</button>`).join("")}</div><div class="after"></div>`;
  const slots = [...stage.querySelectorAll(".slot")], btns = [...stage.querySelectorAll(".letter")];
  const draw = () => slots.forEach((s, k) => { s.textContent = filled[k] ? filled[k].c : ""; s.classList.toggle("f", !!filled[k]); });
  const check = () => {
    if (filled.length < word.length) return;

    } else {

      }, 600);
    }

  slots.forEach((s, k) => s.onclick = () => { if (finished || !filled[k]) return; const rem = filled.splice(k); rem.forEach(f => btns[f.b].classList.remove("used")); draw(); });

    filled.splice(k).forEach(f => btns[f.b].classList.remove("used"));
    if (k >= word.length) return;
    const bi = btns.findIndex((b, j) => !b.classList.contains("used") && letters[j].c === word[k]);
    if (bi < 0) return;
    hinted++; btns[bi].classList.add("used"); filled.push({ c: word[k], b: bi }); draw(); check();
  };
}, done);

/* ---------- Confetti ---------- */
function confetti() {
  if (reduced) return;
  const c = $("#confetti"), ctx = c.getContext("2d"); c.hidden = false;
  const dpr = window.devicePixelRatio || 1; c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--petal", "--petal-deep", "--leaf", "--good"].map(v => cs.getPropertyValue(v).trim() || "#F4B400");
  const P = Array.from({ length: 110 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .35, vx: (Math.random() - .5) * 9, vy: -Math.random() * 11 - 3, r: Math.random() * 6 + 4, a: Math.random() * 6, va: (Math.random() - .5) * .3, c: rnd(cols), petal: Math.random() < .5 }));
  let t0 = performance.now();
  const frame = now => {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    P.forEach(p => { p.vy += .32; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
      if (p.petal) { ctx.beginPath(); ctx.ellipse(0, 0, p.r * .45, p.r, 0, 0, Math.PI * 2); ctx.fill(); } else ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
      ctx.restore(); });
    if (now - t0 < 2600) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, innerWidth, innerHeight); c.hidden = true; }
  };
  requestAnimationFrame(frame);
}

render();
if ("serviceWorker" in navigator) window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
